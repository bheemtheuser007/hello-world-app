version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8081:8080"

  gateway:
    build: ./gateway
    ports:
      - "8083:8080"
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend

  frontend:
    build: ./frontend
    ports:
      - "8082:8080"
    environment:
      - GATEWAY_URL=http://gateway:8080
    depends_on:
      - gateway